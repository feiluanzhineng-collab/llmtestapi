# LLM API Test — same-origin API relay (include in http { } via conf.d)
# Browser -> https://llmtest.feiluanai.com/api/v1/... -> upstream API (no CORS)

map $http_x_llm_base_url $llm_api_origin {
    default                         "";
    ""                              "https://ai.feiluanai.com";
    "https://ai.feiluanai.com/v1"   "https://ai.feiluanai.com";
    "https://bigbangtoken.com/v1"   "https://bigbangtoken.com";
}

map $http_x_llm_base_url $llm_api_host {
    default                         "";
    ""                              "ai.feiluanai.com";
    "https://ai.feiluanai.com/v1"   "ai.feiluanai.com";
    "https://bigbangtoken.com/v1"   "bigbangtoken.com";
}
